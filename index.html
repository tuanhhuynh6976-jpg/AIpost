<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #2a313c;
    --text: #e6e9ee;
    --muted: #8b95a5;
    --accent: #5eead4;
    --accent-ink: #06241f;
    --user: #1f2a37;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 "DM Sans", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Settings */
  details.settings { background: var(--panel); border-bottom: 1px solid var(--line); }
  details.settings > summary {
    cursor: pointer; padding: 12px 20px; color: var(--muted); list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  details.settings > summary::-webkit-details-marker { display: none; }
  details.settings > summary strong { color: var(--text); font-weight: 700; }
  .settings-grid {
    display: grid; gap: 14px 16px; padding: 4px 20px 18px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    max-width: 1100px; margin: 0 auto;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 13px; color: var(--muted); }
  input[type=text], input[type=password], textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; width: 100%;
  }
  .mode-row { display: flex; gap: 18px; margin-bottom: 2px; }
  .mode-row .radio { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .mode-row .radio input { accent-color: var(--accent); cursor: pointer; }
  #system:disabled { opacity: 0.6; cursor: not-allowed; }
  select {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; width: 100%; color-scheme: dark;
  }
  textarea { resize: vertical; }
  input[type=range] { accent-color: var(--accent); width: 100%; }
  .temp-row { display: flex; align-items: center; gap: 12px; }
  .temp-row output { min-width: 2.5em; font-family: "JetBrains Mono", monospace; font-size: 13px; }

  .btn {
    background: transparent; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { filter: brightness(1.08); }
  .files-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    display: inline-flex; gap: 8px; align-items: center; background: var(--bg);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 12px; font-size: 13px;
  }
  .chip button { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 0 6px; font-size: 16px; }
  .chip button:hover { color: var(--danger); }

  /* Chat */
  #chat { flex: 1; overflow-y: auto; padding: 24px 20px 8px; }
  .thread { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .empty { margin: 14vh auto 0; text-align: center; color: var(--muted); max-width: 420px; }
  .empty h1 { color: var(--text); font-size: 26px; margin: 0 0 8px; }
  .msg.user { align-self: flex-end; max-width: 85%; background: var(--user); padding: 10px 14px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; }
  .msg.user .attached { display: block; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .msg.bot { max-width: 100%; overflow-wrap: anywhere; }
  .msg.bot.error { color: var(--danger); }
  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot p, .msg.bot ul, .msg.bot ol { margin: 0 0 12px; }
  .msg.bot pre { background: #0a0d12; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .msg.bot code { font-family: "JetBrains Mono", monospace; font-size: 13px; }
  .msg.bot :not(pre) > code { background: var(--panel); padding: 2px 5px; border-radius: 4px; }
  .msg.bot table { border-collapse: collapse; display: block; overflow-x: auto; }
  .msg.bot th, .msg.bot td { border: 1px solid var(--line); padding: 6px 10px; }
  .actions-wrap { margin-top: -12px; display: flex; flex-direction: column; gap: 10px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; }
  .preview { display: none; align-items: flex-start; gap: 8px; }
  .preview.show { display: flex; }
  .preview img, .preview video { max-height: 220px; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #000; }
  .preview button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; width: 26px; height: 26px; cursor: pointer; color: var(--muted); }
  .preview button:hover { color: var(--danger); }
  .actions .btn { padding: 4px 10px; font-size: 13px; }
  .actions .status.ok { color: var(--accent); }
  .actions .status.err { color: var(--danger); }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }

  /* Composer */
  .composer { padding: 12px 20px 18px; }
  .composer-inner {
    max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px;
  }
  .composer textarea { border: 0; background: transparent; resize: none; max-height: 200px; padding: 8px 10px; }
  .composer textarea:focus-visible { outline: none; }
  .composer-inner:focus-within { border-color: var(--accent); }
  .hint { max-width: 780px; margin: 6px auto 0; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .hint button { background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: underline; padding: 0; }
</style>
</head>
<body>

<details class="settings" open>
  <summary><strong>Settings</strong><span id="summaryText">Add your API key to start</span></summary>
  <div class="settings-grid">
    <div class="field">
      <label for="provider">Provider</label>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    </div>
    <div class="field">
      <label for="apiKey" id="keyLabel">Gemini API key</label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="Paste your key">
    </div>
    <div class="field">
      <label for="model">Model name</label>
      <input id="model" type="text" value="gemini-3.6-flash" autocomplete="off">
    </div>
    <div class="field">
      <label for="temp">Temperature</label>
      <div class="temp-row">
        <input id="temp" type="range" min="0" max="2" step="0.1" value="1">
        <output id="tempOut" for="temp">1.0</output>
      </div>
    </div>
    <div class="field wide">
      <label>System prompt</label>
      <div class="mode-row">
        <label class="radio"><input type="radio" name="promptMode" id="modeFacebook" value="facebook" checked> Facebook post mode</label>
        <label class="radio"><input type="radio" name="promptMode" id="modeCustom" value="custom"> Custom prompt</label>
      </div>
      <textarea id="system" rows="2" placeholder="e.g. You are a helpful assistant that writes short, punchy Facebook posts." disabled></textarea>
    </div>
    <div class="field">
      <label for="hook">n8n webhook URL (for Facebook posting)</label>
      <input id="hook" type="text" autocomplete="off" placeholder="https://your-n8n.app.n8n.cloud/webhook/facebook-post">
    </div>
    <div class="field">
      <label for="secret">n8n secret</label>
      <input id="secret" type="password" autocomplete="off" placeholder="Same value as in the n8n workflow">
    </div>
    <div class="field">
      <label for="imgModel">Image model (Gemini)</label>
      <input id="imgModel" type="text" value="gemini-2.5-flash-image" autocomplete="off">
    </div>
    <div class="field">
      <label for="imgKey">Image API key (blank = reuse Gemini key)</label>
      <input id="imgKey" type="password" autocomplete="off" placeholder="Only needed if provider is DeepSeek">
    </div>
    <div class="field wide">
      <label id="fileLabel">Files the AI can read (images, PDFs, text, code, CSV)</label>
      <div class="files-row">
        <button class="btn" id="fileBtn" type="button">Upload files</button>
        <input id="fileInput" type="file" multiple hidden
               accept="image/*,application/pdf,.txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log">
        <span id="chips" class="files-row"></span>
      </div>
    </div>
  </div>
</details>

<main id="chat" aria-live="polite">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <h1>What are we working on?</h1>
      <p>Set your key and model above, then send a message. The chat remembers earlier messages until you start a new chat or refresh.</p>
    </div>
  </div>
</main>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="Message the model…" aria-label="Message"></textarea>
    <button class="btn primary" id="sendBtn" type="button">Send</button>
  </div>
  <div class="hint">
    <span>Enter to send, Shift+Enter for a new line</span>
    <button id="newChat" type="button">New chat</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const els = {
  key: $("apiKey"), model: $("model"), temp: $("temp"), tempOut: $("tempOut"),
  system: $("system"), fileBtn: $("fileBtn"), fileInput: $("fileInput"), chips: $("chips"),
  thread: $("thread"), chat: $("chat"), input: $("input"), send: $("sendBtn"),
  newChat: $("newChat"), summary: $("summaryText"),
  hook: $("hook"), secret: $("secret"), provider: $("provider"), imgModel: $("imgModel"), imgKey: $("imgKey"),
  modeFacebook: $("modeFacebook"), modeCustom: $("modeCustom"), keyLabel: $("keyLabel"), fileLabel: $("fileLabel")
};

// Temporary chat memory: lives only in this array. Refresh or "New chat" wipes it.
let history = [];
let pendingFiles = [];   // files attached to the next message
let controller = null;   // for stopping a stream
let streaming = false;

const TEXT_EXT = /\.(txt|md|csv|json|js|ts|py|html|css|xml|ya?ml|log)$/i;
const MAX_BYTES = 15 * 1024 * 1024;

els.temp.addEventListener("input", () => { els.tempOut.textContent = Number(els.temp.value).toFixed(1); });
els.key.addEventListener("input", updateSummary);
els.model.addEventListener("input", updateSummary);
function updateSummary() {
  els.summary.textContent = els.key.value.trim() ? els.model.value.trim() || "Set a model" : "Add your API key to start";
}

/* ---------- System prompt mode ---------- */
const FB_PRESET = `You write Facebook posts. When the user asks for a post (or asks to change one), reply with ONLY the finished post text, ready to publish as-is.
Rules:
- No introductions, explanations, or closing questions. Never write things like "Here's a version" or "Want me to tweak it?".
- No separators such as "---", no titles or labels, and no quotation marks around the post.
- Plain text only. Facebook doesn't render markdown, so never use **bold**, *italics*, #headers, or bullet symbols like "-" or "*". Use line breaks and emojis for structure.
- Hashtags go at the end, on their own line, and only a few relevant ones.
- If the user asks for changes, output the complete updated post, not just the changed part.
- If the user's message is clearly not a request for a post (for example a general question), answer it normally and briefly.`;

let customPromptDraft = "";  // remembers what the user typed in Custom mode while Facebook mode is active

function applyPromptMode() {
  if (els.modeFacebook.checked) {
    els.system.value = FB_PRESET;
    els.system.disabled = true;
  } else {
    els.system.value = customPromptDraft;
    els.system.disabled = false;
    els.system.focus();
  }
}
els.modeFacebook.addEventListener("change", applyPromptMode);
els.modeCustom.addEventListener("change", applyPromptMode);
els.system.addEventListener("input", () => {
  if (els.modeCustom.checked) customPromptDraft = els.system.value;
});
function getSystemPrompt() {
  return (els.modeFacebook.checked ? FB_PRESET : els.system.value).trim();
}
applyPromptMode(); // Facebook post mode is the default on load

/* ---------- Providers ---------- */
const PROVIDERS = {
  gemini: {
    keyLabel: "Gemini API key", model: "gemini-3.6-flash",
    fileLabel: "Files the AI can read (images, PDFs, text, code, CSV)"
  },
  deepseek: {
    keyLabel: "DeepSeek API key", model: "deepseek-chat",
    fileLabel: "Files the AI can read (text, code, CSV only. DeepSeek can't read images or PDFs)"
  }
};
const savedKeys = { gemini: "", deepseek: "" };  // each provider remembers its own key (in memory only)
const savedModels = { gemini: PROVIDERS.gemini.model, deepseek: PROVIDERS.deepseek.model };
let currentProvider = "gemini";

els.provider.addEventListener("change", () => {
  savedKeys[currentProvider] = els.key.value;
  savedModels[currentProvider] = els.model.value;
  currentProvider = els.provider.value;
  const p = PROVIDERS[currentProvider];
  els.key.value = savedKeys[currentProvider];
  els.model.value = savedModels[currentProvider];
  els.keyLabel.textContent = p.keyLabel;
  els.fileLabel.textContent = p.fileLabel;
  if (currentProvider === "deepseek" && pendingFiles.some((f) => f.part.inlineData)) {
    pendingFiles = pendingFiles.filter((f) => !f.part.inlineData);
    renderChips();
    alert("Images and PDFs were removed because DeepSeek only reads text.");
  }
  updateSummary();
});

/* ---------- Files ---------- */
els.fileBtn.addEventListener("click", () => els.fileInput.click());
els.fileInput.addEventListener("change", async () => {
  for (const f of els.fileInput.files) {
    if (f.size > MAX_BYTES) { alert(f.name + " is over 15 MB and was skipped."); continue; }
    try {
      const item = await readFile(f);
      if (item.part.inlineData && els.provider.value === "deepseek") {
        alert(f.name + " skipped: DeepSeek can only read text files (txt, md, csv, json, code).");
        continue;
      }
      pendingFiles.push(item);
    }
    catch { alert("Could not read " + f.name); }
  }
  els.fileInput.value = "";
  renderChips();
});

function readFile(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = reject;
    if (file.type.startsWith("text/") || TEXT_EXT.test(file.name)) {
      r.onload = () => resolve({ name: file.name, part: { text: `[File: ${file.name}]\n${r.result}\n[End of file]` } });
      r.readAsText(file);
    } else {
      r.onload = () => resolve({
        name: file.name,
        part: { inlineData: { mimeType: file.type || "application/octet-stream", data: String(r.result).split(",")[1] } }
      });
      r.readAsDataURL(file);
    }
  });
}

function renderChips() {
  els.chips.innerHTML = "";
  pendingFiles.forEach((f, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = f.name;
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove " + f.name);
    x.onclick = () => { pendingFiles.splice(i, 1); renderChips(); };
    chip.appendChild(x);
    els.chips.appendChild(chip);
  });
}

/* ---------- Rendering ---------- */
function renderMarkdown(el, text) {
  if (window.marked && window.DOMPurify) el.innerHTML = DOMPurify.sanitize(marked.parse(text));
  else el.textContent = text;
}
function addMessage(kind, text) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + kind;
  if (text) div.textContent = text;
  els.thread.appendChild(div);
  scrollDown();
  return div;
}
function scrollDown() { els.chat.scrollTop = els.chat.scrollHeight; }

/* ---------- Sending ---------- */
// History is stored in Gemini's format; DeepSeek gets a converted copy.
function buildRequest(provider, model, apiKey) {
  const temperature = Number(els.temp.value);
  const sys = getSystemPrompt();

  if (provider === "deepseek") {
    const messages = [];
    if (sys) messages.push({ role: "system", content: sys });
    for (const turn of history) {
      const content = turn.parts
        .map((p) => p.text ?? "[attached file omitted: DeepSeek is text-only]")
        .join("\n\n");
      messages.push({ role: turn.role === "model" ? "assistant" : "user", content });
    }
    return {
      url: "https://api.deepseek.com/chat/completions",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + apiKey },
      body: { model, messages, temperature, stream: true }
    };
  }

  const body = { contents: history, generationConfig: { temperature } };
  if (sys) body.systemInstruction = { parts: [{ text: sys }] };
  return {
    url: `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:streamGenerateContent?alt=sse`,
    headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
    body
  };
}

function extractText(provider, chunk) {
  if (provider === "deepseek") return chunk.choices?.[0]?.delta?.content || "";
  if (chunk.promptFeedback?.blockReason) throw new Error("Blocked: " + chunk.promptFeedback.blockReason);
  return chunk.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || "";
}
async function send() {
  if (streaming) { controller?.abort(); return; }

  const text = els.input.value.trim();
  const apiKey = els.key.value.trim();
  const model = els.model.value.trim().replace(/^models\//, "");
  const provider = els.provider.value;
  if (!text && !pendingFiles.length) return;
  if (!apiKey) { alert("Paste your API key in Settings first."); return; }
  if (!model) { alert("Enter a model name in Settings."); return; }

  // Build the user turn (text + any attached files)
  const files = pendingFiles;
  pendingFiles = []; renderChips();
  const parts = files.map((f) => f.part);
  parts.push({ text: text || "Please look at the attached file(s)." });
  const userTurn = { role: "user", parts };

  const bubble = addMessage("user", text);
  if (files.length) {
    const s = document.createElement("span");
    s.className = "attached";
    s.textContent = "Attached: " + files.map((f) => f.name).join(", ");
    bubble.appendChild(s);
  }
  els.input.value = ""; autoGrow();

  history.push(userTurn);
  const botEl = addMessage("bot cursor");
  setStreaming(true);
  controller = new AbortController();

  let full = "";
  try {
    const req = buildRequest(provider, model, apiKey);
    const res = await fetch(req.url, {
      method: "POST",
      headers: req.headers,
      body: JSON.stringify(req.body),
      signal: controller.signal
    });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { msg = (await res.json()).error?.message || msg; } catch {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", queued = false;
    const paint = () => { queued = false; renderMarkdown(botEl, full); scrollDown(); };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (!payload) continue;
        if (payload === "[DONE]") continue;
        try {
          full += extractText(provider, JSON.parse(payload));
        } catch (e) { if (e.message?.startsWith("Blocked")) throw e; }
      }
      if (!queued) { queued = true; requestAnimationFrame(paint); }
    }
    if (!full) throw new Error("The model returned an empty response.");
    history.push({ role: "model", parts: [{ text: full }] });
  } catch (err) {
    if (err.name === "AbortError") {
      if (full) history.push({ role: "model", parts: [{ text: full }] });
      else history.pop();
    } else {
      history.pop(); // drop the failed user turn so memory stays consistent
      botEl.classList.add("error");
      botEl.textContent = "Request failed: " + err.message +
        (err instanceof TypeError ? " (network or CORS problem. Check your connection, key, and model name.)" : "");
    }
  } finally {
    botEl.classList.remove("cursor");
    if (full) { renderMarkdown(botEl, full); addActions(botEl, full); }
    setStreaming(false);
    controller = null;
    els.input.focus();
  }
}

/* ---------- Post to Facebook via n8n ---------- */
// n8n.cloud rejects request bodies over about 16 MB, so keep uploads under this
const MAX_UPLOAD = 15 * 1024 * 1024;

function addActions(botEl, text) {
  // state.media = { blob, kind: "image" | "gif" | "video", name, url }  (lives only in memory)
  const state = { media: null };

  const wrap = document.createElement("div");
  wrap.className = "actions-wrap";
  const row = document.createElement("div");
  row.className = "actions";
  const preview = document.createElement("div");
  preview.className = "preview";

  const mk = (label) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn"; b.textContent = label;
    return b;
  };
  const postBtn = mk("Post to Facebook");
  const genBtn = mk("Generate image");
  const attachBtn = mk("Attach image / GIF / video");
  const fileIn = document.createElement("input");
  fileIn.type = "file"; fileIn.accept = "image/*,video/*"; fileIn.hidden = true;
  const status = document.createElement("span");
  status.className = "status";

  const setMedia = (m) => {
    if (state.media) URL.revokeObjectURL(state.media.url);
    state.media = m;
    preview.innerHTML = "";
    preview.classList.toggle("show", !!m);
    if (!m) return;
    m.url = URL.createObjectURL(m.blob);
    let el;
    if (m.kind === "video") {
      el = document.createElement("video");
      el.controls = true; el.muted = true; el.playsInline = true; el.preload = "metadata";
    } else {
      el = document.createElement("img");
      el.alt = "Media attached to the post";
    }
    el.src = m.url;
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove attachment");
    x.onclick = () => setMedia(null);
    preview.append(el, x);
    scrollDown();
  };

  postBtn.onclick = () => postToFacebook(text, state, postBtn, status);
  genBtn.onclick = () => generateImage(text, genBtn, status, setMedia);
  attachBtn.onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files[0];
    fileIn.value = "";
    if (!f) return;
    status.className = "status"; status.textContent = "";
    try {
      if (f.type.startsWith("video/") || f.type === "image/gif") {
        if (f.size > MAX_UPLOAD) {
          throw new Error(`File is ${(f.size / 1048576).toFixed(1)} MB. n8n.cloud accepts about 15 MB, so trim the clip or compress it first.`);
        }
        setMedia({ blob: f, kind: f.type === "image/gif" ? "gif" : "video", name: f.name });
      } else if (f.type.startsWith("image/")) {
        setMedia({ blob: await toJpeg(f), kind: "image", name: "post.jpg" });
      } else {
        throw new Error("Choose an image, GIF, or video file.");
      }
    } catch (err) { status.className = "status err"; status.textContent = err.message; }
  };

  row.append(postBtn, genBtn, attachBtn, fileIn, status);
  wrap.append(row, preview);
  botEl.after(wrap);
  scrollDown();
}

// Shrink a still image to max 1600px and re-encode as JPEG (returns a Blob)
async function toJpeg(src) {
  const url = typeof src === "string" ? src : URL.createObjectURL(src);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale);
    c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob((b) => b ? res(b) : rej(new Error("Could not read that image.")), "image/jpeg", 0.85));
  } finally {
    if (typeof src !== "string") URL.revokeObjectURL(url);
  }
}

async function generateImage(text, btn, status, setMedia) {
  const key = els.imgKey.value.trim() || (els.provider.value === "gemini" ? els.key.value.trim() : savedKeys.gemini.trim());
  const model = els.imgModel.value.trim().replace(/^models\//, "");
  if (!key) { alert("Image generation needs a Gemini key. Paste one in 'Image API key', or switch the provider to Gemini and enter it there."); return; }
  if (!model) { alert("Enter an image model in Settings."); return; }

  const prompt = window.prompt(
    "Describe the image to generate (edit if you like):",
    "A clean, eye-catching photo for this Facebook post. Do not include any text or lettering in the image. Post: " + text.slice(0, 500)
  );
  if (!prompt) return;

  btn.disabled = true;
  status.className = "status"; status.textContent = "Generating image…";
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-goog-api-key": key },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { responseModalities: ["TEXT", "IMAGE"] }
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error?.message || res.status + " " + res.statusText);
    const parts = data.candidates?.[0]?.content?.parts || [];
    const imgPart = parts.find((p) => p.inlineData || p.inline_data);
    if (!imgPart) throw new Error(parts.map((p) => p.text).filter(Boolean).join(" ") || "The model returned no image.");
    const d = imgPart.inlineData || imgPart.inline_data;
    const blob = await toJpeg("data:" + (d.mimeType || d.mime_type || "image/png") + ";base64," + d.data);
    setMedia({ blob, kind: "image", name: "post.jpg" });
    status.textContent = "";
  } catch (err) {
    status.className = "status err"; status.textContent = "Image failed: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

async function postToFacebook(text, state, btn, status) {
  const url = els.hook.value.trim();
  if (!url) { alert("Add your n8n webhook URL in Settings first."); return; }
  const m = state.media;
  const label = !m ? "" : m.kind === "video" ? " (with video)" : m.kind === "gif" ? " (with GIF)" : " (with image)";
  const preview = text.slice(0, 400) + (text.length > 400 ? "…" : "");
  if (!confirm("Post this to your Facebook Page" + label + "?\n\n" + preview)) return;

  btn.disabled = true;
  status.className = "status"; status.textContent = m && m.kind === "video" ? "Uploading video… this can take a minute" : "Posting…";
  try {
    // multipart/form-data: text fields go in n8n's body, the file arrives as binary "media"
    const fd = new FormData();
    fd.append("message", text);
    fd.append("secret", els.secret.value);
    fd.append("mediaType", !m ? "none" : m.kind === "video" ? "video" : "image");  // GIFs post as photos
    if (m) fd.append("media", m.blob, m.name);

    const res = await fetch(url, { method: "POST", body: fd });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok || data.ok === false) throw new Error(data.error || res.status + " " + res.statusText);
    status.className = "status ok";
    status.textContent = m && m.kind === "video"
      ? "Uploaded (id " + (data.id || "?") + "). Facebook may take a minute to process it."
      : "Posted" + (data.id ? " (id " + data.id + ")" : "");
  } catch (err) {
    status.className = "status err"; status.textContent = "Post failed: " + err.message;
    btn.disabled = false;
  }
}

function setStreaming(on) {
  streaming = on;
  els.send.textContent = on ? "Stop" : "Send";
}

/* ---------- Input behavior ---------- */
function autoGrow() {
  els.input.style.height = "auto";
  els.input.style.height = Math.min(els.input.scrollHeight, 200) + "px";
}
els.input.addEventListener("input", autoGrow);
els.input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!streaming) send(); }
});
els.send.addEventListener("click", send);

els.newChat.addEventListener("click", () => {
  controller?.abort();
  history = [];
  els.thread.innerHTML = `<div class="empty" id="empty"><h1>What are we working on?</h1><p>New chat started. Earlier messages are forgotten.</p></div>`;
});
</script>
